
name: AgentGuard Tests

on:
  push:
    branches:
      - integration/main-readiness
      - West-platform
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run unit tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run standalone B1 tests
        run: python -c "import runpy; runpy.run_path('tests/test_b1.py', run_name='__main__')"

      - name: Test Qwen bridge and Room API
        working-directory: prototype
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Install frontend dependencies
        working-directory: prototype
        run: npm ci

      - name: Build and smoke test Room
        working-directory: prototype
        run: |
          npm run build
          npm run test:smoke

      - name: Run scripted security demo
        run: python -m evaluation.export_demo

      - name: Check evaluation plan
        run: python -m evaluation.run_matrix --dry-run
